name: Release

# Release day: bump versionCode/versionName in app/build.gradle.kts, add a
# "## vX.Y.Z" section to changelog.md (GitHub release body), set release.md
# (line 1 = "vX.Y.Z - Title", plus Play "What's new", max 500 chars), commit and
# push to main. A push that changes release.md releases that version once: if
# the vX.Y.Z tag already exists the run does nothing, so editing release.md
# later (typos) never re-releases. The tag and a GitHub pre-release are created
# only after the Play upload succeeds; the in-app update check
# (/releases/latest) ignores pre-releases, so untick "pre-release" only after
# Play approves. A failed run leaves no tag: fix and re-run it from Actions.
on:
  push:
    branches: [main]
    paths: [release.md]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.tag.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(sed -n '1s/^# \(v[0-9][0-9.]*\).*/\1/p' release.md)
          if [ -z "$tag" ]; then echo "release.md line 1 must start with '# vX.Y.Z'" >&2; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches versionName
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "${TAG}" ]; then
            echo "Tag ${TAG} (release.md) does not match versionName v$version" >&2
            exit 1
          fi

      - name: Prepare release notes
        run: |
          # GitHub title: first line of release.md without "# "
          title=$(sed -n '1s/^# //p' release.md)
          case "$title" in "${TAG}"*) ;; *) echo "release.md title '$title' does not start with ${TAG}" >&2; exit 1;; esac
          echo "$title" > "$RUNNER_TEMP/title.txt"
          # Play notes: lines under "## Play Store (en-US)"
          mkdir -p "$RUNNER_TEMP/whatsnew"
          awk '/^## Play Store/ {f=1; next} f && /^## / {exit} f' release.md | tr -d '\r' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' | sed '/./,$!d' > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          n=$(wc -m < "$RUNNER_TEMP/whatsnew/whatsnew-en-US")
          if [ "$n" -eq 0 ]; then echo "Play notes in release.md are empty" >&2; exit 1; fi
          if [ "$n" -gt 500 ]; then echo "Play notes are $n chars, Play allows 500" >&2; exit 1; fi
          # GitHub body: changelog.md section "## vX.Y.Z" up to the next "## "
          { echo "## ${TAG} (Released - Play Store)"; awk -v v="## ${TAG}" 'index($0, v)==1 {f=1; next} f && /^## / {exit} f' changelog.md; } > "$RUNNER_TEMP/body.md"
          if [ "$(wc -l < "$RUNNER_TEMP/body.md")" -lt 3 ]; then echo "No '## ${TAG}' section in changelog.md" >&2; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release-key.jks
          echo "$KEYSTORE_PROPERTIES" > keystore/keystore.properties

      - name: Build signed AAB and APK
        run: ./gradlew bundleRelease assembleRelease

      - name: Upload to Google Play (production rollout)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.minifocus.launcher
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
          track: production
          status: completed

      - name: Create GitHub pre-release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" app/build/outputs/apk/release/app-release.apk --target "${GITHUB_SHA}" \
            --title "$(cat "$RUNNER_TEMP/title.txt")" --notes-file "$RUNNER_TEMP/body.md" --prerelease
