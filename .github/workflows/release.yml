name: Release

# Release day: bump versionCode/versionName in app/build.gradle.kts, add a
# "## vX.Y.Z" section to changelog.md (the GitHub release body), edit release.md
# (GitHub title + Play "What's new", max 500 chars), commit, push, then push the tag:
#   git tag vX.Y.Z && git push origin vX.Y.Z
# The GitHub release is created as a pre-release, which the in-app update check
# (/releases/latest) ignores. Untick "pre-release" only after Play approves.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches versionName
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName v$version" >&2
            exit 1
          fi

      - name: Prepare release notes
        run: |
          # GitHub title: first line of release.md without "# "
          title=$(sed -n '1s/^# //p' release.md)
          case "$title" in "${GITHUB_REF_NAME}"*) ;; *) echo "release.md title '$title' does not start with ${GITHUB_REF_NAME}" >&2; exit 1;; esac
          echo "$title" > "$RUNNER_TEMP/title.txt"
          # Play notes: lines under "## Play Store (en-US)"
          mkdir -p "$RUNNER_TEMP/whatsnew"
          awk '/^## Play Store/ {f=1; next} f && /^## / {exit} f' release.md | tr -d '\r' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' | sed '/./,$!d' > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          n=$(wc -m < "$RUNNER_TEMP/whatsnew/whatsnew-en-US")
          if [ "$n" -eq 0 ]; then echo "Play notes in release.md are empty" >&2; exit 1; fi
          if [ "$n" -gt 500 ]; then echo "Play notes are $n chars, Play allows 500" >&2; exit 1; fi
          # GitHub body: changelog.md section "## vX.Y.Z" up to the next "## "
          { echo "## ${GITHUB_REF_NAME} (Released - Play Store)"; awk -v v="## ${GITHUB_REF_NAME}" 'index($0, v)==1 {f=1; next} f && /^## / {exit} f' changelog.md; } > "$RUNNER_TEMP/body.md"
          if [ "$(wc -l < "$RUNNER_TEMP/body.md")" -lt 3 ]; then echo "No '## ${GITHUB_REF_NAME}' section in changelog.md" >&2; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release-key.jks
          echo "$KEYSTORE_PROPERTIES" > keystore/keystore.properties

      - name: Build signed AAB and APK
        run: ./gradlew bundleRelease assembleRelease

      - name: Upload to Google Play (production rollout)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.minifocus.launcher
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
          track: production
          status: completed

      - name: Create GitHub pre-release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" app/build/outputs/apk/release/app-release.apk \
            --title "$(cat "$RUNNER_TEMP/title.txt")" --notes-file "$RUNNER_TEMP/body.md" --prerelease
